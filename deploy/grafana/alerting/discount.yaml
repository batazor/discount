# Grafana-managed alert rules for the discount service (spec `grafana-dashboards`,
# "Provisioned alert rules"). Mounted by deploy/compose.yaml into Grafana's provisioning
# directory; edit here, never in the UI (provisioned rules are read-only there).
#
# Each rule is one instant PromQL query (A) and one threshold expression (B, the condition).
# No contact point is defined: notifications follow the default policy; route on the labels
# `service` and `severity`.
apiVersion: 1
groups:
  - orgId: 1
    name: discount
    folder: Discount
    interval: 1m
    rules:
      - uid: discount-http-5xx-ratio
        title: HTTP 5xx ratio per route
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        dashboardUid: discount-overview
        panelId: 11
        labels: { service: discount, severity: warning }
        annotations:
          summary: "{{ $labels.span_name }}: {{ printf \"%.1f\" (mul $values.A.Value 100) }}% of requests answered 5xx over 5 minutes"
          description: Server spans with status Error (5xx) as a share of all requests on the route, from Tempo span metrics. 4xx (including 422 pricing rejections) are not counted.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: sum by (span_name) (rate(traces_spanmetrics_calls_total{service="discount",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) / sum by (span_name) (rate(traces_spanmetrics_calls_total{service="discount",span_kind="SPAN_KIND_SERVER"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: discount-redeem-p95
        title: Redeem p95 latency
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        dashboardUid: discount-overview
        panelId: 12
        labels: { service: discount, severity: warning }
        annotations:
          summary: "POST /v1/redeem p95 is {{ printf \"%.0f\" (mul $values.A.Value 1000) }} ms over 5 minutes"
          description: 95th percentile of the server span duration of POST /v1/redeem (reservation transaction included), from Tempo span metrics.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service="discount",span_kind="SPAN_KIND_SERVER",span_name="POST /v1/redeem"}[5m])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }

      - uid: discount-evaluation-errors
        title: Pricing error ratio
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        dashboardUid: discount-overview
        panelId: 2
        labels: { service: discount, severity: warning }
        annotations:
          summary: "{{ printf \"%.0f\" (mul $values.A.Value 100) }}% of evaluations rejected over 10 minutes"
          description: discount.evaluations{outcome="error"} as a share of all evaluations. A sustained high ratio means a caller sends invalid carts; see the Validation errors dashboard for the error_type breakdown.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: sum(rate(discount_evaluations_total{outcome="error"}[10m])) / sum(rate(discount_evaluations_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }

      - uid: discount-budget-exhausted
        title: Promotion budget exhausted
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        dashboardUid: discount-promotions
        labels: { service: discount, severity: critical }
        annotations:
          summary: "Promotion {{ $labels.promotion_id }} has no budget left ({{ $values.A.Value }} {{ $labels.currency }} minor units)"
          description: discount.budget.remaining is at or below zero; the promotion is skipped with clamped_by=Budget until the budget is raised (PUT /v1/promotions/{id}/budget).
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: min by (promotion_id, currency) (discount_budget_remaining)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: discount-redemption-storage-errors
        title: Redemption storage errors
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        dashboardUid: discount-promotions
        panelId: 10
        labels: { service: discount, severity: critical }
        annotations:
          summary: "{{ printf \"%.2f\" $values.A.Value }} redemption storage errors per second over 5 minutes"
          description: discount.redemptions{outcome="error"} counts storage failures only (rejections such as 409 InvalidTransition are outcome="rejected"); the redemption store is failing reserve/confirm/cancel.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: sum(rate(discount_redemptions_total{outcome="error"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
