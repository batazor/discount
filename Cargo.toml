[workspace]
resolver = "3"
members = ["src/domain", "src/application", "src/infrastructure", "src/client", "verification/drt", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/batazor/discount"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
