schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Spec-driven project: docs/ubiquitous-language.md is the single vocabulary, verification/spec/ (Lean 4)
  is the source of truth for the pricing engine, verification/proofs/ holds the theorems about it, src/domain/ (Rust) mirrors it function by
  function and verification/drt/ compares them. Only the pricing engine is in the verified scope;
  src/applicationlication/, src/infrastructure/ and observability get ordinary tests.
  A new domain concept enters docs/ubiquitous-language.md first, then verification/spec/, then src/domain/.
  ADRs in docs/adr are living documents edited in place (adr-tools); no superseding ADRs.
  Rust src/domain/ depends on std and serde (derive) only; no telemetry code in src/domain/.
  Money is integer minor units; no floats anywhere.
rules:
  proposal:
    - State explicitly what stays outside the verified scope
  tasks:
    - Every task names the crate or directory it touches
